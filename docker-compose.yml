services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: miscellary
      POSTGRES_PASSWORD: miscellary
      POSTGRES_DB: miscellary
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U miscellary']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: create the media bucket, make it public-read, allow browser uploads.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/miscellary-media &&
      mc anonymous set download local/miscellary-media
      "

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: dev
    command: >
      sh -c "uv sync --frozen --no-install-project &&
      uv run python manage.py migrate &&
      uv run python manage.py runserver 0.0.0.0:8000"
    env_file: apps/api/.env
    environment:
      DATABASE_URL: postgres://miscellary:miscellary@db:5432/miscellary
      TEST_DATABASE_URL: postgres://miscellary:miscellary@db:5432/miscellary
      AWS_S3_ENDPOINT_URL: http://minio:9000
      AWS_S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
    volumes:
      - .:/repo
      - api-venv:/repo/apps/api/.venv
    ports:
      - '8000:8000'
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      target: dev
    command: >
      sh -c "CI=true pnpm install --frozen-lockfile --filter web... --store-dir /pnpm/store &&
      pnpm --filter web dev"
    env_file: apps/web/.env
    volumes:
      - .:/repo
      - node-modules:/repo/node_modules
      - web-node-modules:/repo/apps/web/node_modules
      - shared-node-modules:/repo/packages/shared/node_modules
      - config-node-modules:/repo/packages/config/node_modules
      - web-next:/repo/apps/web/.next
      - pnpm-store:/pnpm/store
    ports:
      - '3000:3000'
    depends_on:
      - api

volumes:
  pgdata:
  miniodata:
  api-venv:
  node-modules:
  web-node-modules:
  shared-node-modules:
  config-node-modules:
  web-next:
  pnpm-store:
