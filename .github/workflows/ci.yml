name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Django)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: miscellary
          POSTGRES_PASSWORD: miscellary
          POSTGRES_DB: miscellary
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U miscellary"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      - run: uv run python manage.py check
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - run: uv run python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - run: uv run pytest
        env:
          TEST_DATABASE_URL: postgres://miscellary:miscellary@localhost:5432/miscellary

  ts:
    name: TypeScript (web, shared, mobile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm turbo run lint typecheck test
      - run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          EXPO_PUBLIC_API_URL: http://10.0.2.2:8000
