[project]
name = "miscellary-api"
version = "0.0.0"
description = "Miscellary REST API (Django + DRF)"
requires-python = ">=3.12"
dependencies = [
  "django>=5.1,<5.3",
  "djangorestframework>=3.16",
  "djangorestframework-simplejwt>=5.5",
  "django-cors-headers>=4.7",
  "drf-spectacular>=0.28",
  "psycopg[binary]>=3.2",
  "environs[django]>=14",
  "gunicorn>=23",
  "boto3>=1.38",
  "whitenoise>=6.9",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-django>=4.11",
  "moto[s3]>=5.1",
  "ruff>=0.11",
  "mypy>=1.15",
  "django-stubs[compatible-mypy]>=5.2",
  "djangorestframework-stubs>=3.16",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["accounts", "cards", "common", "config", "packs", "social", "trades", "uploads"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "--ds=config.settings.test --reuse-db -q"

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
ignore_missing_imports = true
exclude = ["migrations/"]

[tool.django-stubs]
django_settings_module = "config.settings.test"
