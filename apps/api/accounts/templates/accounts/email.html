<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>{{ subject }}</title>
  </head>
  <body style="margin:0;padding:0;background:#f4eee1;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4eee1;">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;">
            <tr>
              <td style="padding:0 4px 14px;font:700 22px/1 'Arial Narrow',Arial,sans-serif;letter-spacing:0.02em;color:#1e6e67;">
                Miscellary
              </td>
            </tr>
            <tr>
              <td style="padding:28px 28px 26px;background:#f9f4ea;border:1px solid #ddd3bf;border-radius:8px;font:16px/1.5 Arial,sans-serif;color:#372e25;">
                <p style="margin:0 0 14px;">Hi @{{ username }},</p>
                <p style="margin:0 0 22px;">{{ intro }}</p>
                <table role="presentation" cellpadding="0" cellspacing="0">
                  <tr>
                    <td style="border-radius:6px;background:#278b82;">
                      <a href="{{ link }}" style="display:inline-block;padding:12px 22px;font:700 15px/1 Arial,sans-serif;color:#f6f0e4;text-decoration:none;">{{ action }}</a>
                    </td>
                  </tr>
                </table>
                <p style="margin:22px 0 0;font-size:13px;color:#6f6355;">
                  Or paste this link into your browser:<br />
                  <a href="{{ link }}" style="color:#1e6e67;word-break:break-all;">{{ link }}</a>
                </p>
                {% if outro %}<p style="margin:14px 0 0;font-size:13px;color:#6f6355;">{{ outro }}</p>{% endif %}
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
